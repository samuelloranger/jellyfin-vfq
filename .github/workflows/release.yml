name: Build and Release Plugin

on:
  push:
    branches:
      - main
    paths:
      - 'Jellyfin.Plugin.VFQ/**'
      - 'Directory.Build.props'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Skip commits made by this workflow to avoid infinite loops.
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine next version
        id: version
        run: |
          # Directory.Build.props owns the release line (MAJOR.MINOR); tags own the patch.
          # The Jellyfin 12 line is 2.x; the Jellyfin 10.11 line stopped at 1.0.5.0.
          BASE=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          IFS='.' read -r MAJOR MINOR _ _ <<< "$BASE"

          LATEST_TAG=$(git tag -l "v${MAJOR}.${MINOR}.*" --sort=-v:refname | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="${MAJOR}.${MINOR}.0.0"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r _ _ PATCH REV <<< "$VERSION"
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}.${REV}"
          fi
          NEW_TAG="v${NEW_VERSION}"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Release line ${MAJOR}.${MINOR}: ${LATEST_TAG:-<none>} -> $NEW_TAG"

      - name: Update Directory.Build.props
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > Directory.Build.props << EOF
          <Project>
              <PropertyGroup>
                  <Version>${VERSION}</Version>
                  <AssemblyVersion>${VERSION}</AssemblyVersion>
                  <FileVersion>${VERSION}</FileVersion>
              </PropertyGroup>
          </Project>
          EOF

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Create plugin zip
        id: zip
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ZIP_NAME="Jellyfin.Plugin.VFQ_${TAG}.zip"
          ZIP_PATH="Jellyfin.Plugin.VFQ/bin/Release/net10.0/${ZIP_NAME}"
          cd Jellyfin.Plugin.VFQ/bin/Release/net10.0
          zip -j "$ZIP_NAME" Jellyfin.Plugin.VFQ.dll
          cd -
          CHECKSUM=$(md5sum "$ZIP_PATH" | awk '{print $1}')
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json
        run: |
          export VERSION="${{ steps.version.outputs.version }}"
          export CHECKSUM="${{ steps.zip.outputs.checksum }}"
          export TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Jellyfin.Plugin.VFQ_${{ steps.version.outputs.tag }}.zip"
          export COMMIT_MSG=$(git log -1 --pretty=%s)

          python3 << 'PYEOF'
          import json
          import os

          with open("manifest.json", "r") as f:
              manifest = json.load(f)

          new_version = {
              "version": os.environ["VERSION"],
              "changelog": os.environ["COMMIT_MSG"],
              "targetAbi": "12.0.0.0",
              "sourceUrl": os.environ["SOURCE_URL"],
              "checksum": os.environ["CHECKSUM"],
              "timestamp": os.environ["TIMESTAMP"],
          }

          manifest[0]["versions"].insert(0, new_version)

          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PYEOF

      - name: Commit version bump
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props manifest.json
          git commit -m "Release ${TAG}: update manifest and version [ci skip]"
          git tag "$TAG"
          git push origin main --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ steps.zip.outputs.zip_path }}
          generate_release_notes: true
